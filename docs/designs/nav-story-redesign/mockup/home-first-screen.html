<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬서운 이야기 첫 화면 시안</title>
<style>
@font-face{font-family:"STS GC Batang";src:url("https://scare-the-spire.flavono123.workers.dev/fonts/GyeonggiCheonnyeonBatangBold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#09090b; --surface:#111114; --surface-2:#18181c; --line:#26262c; --line-2:#34343c;
  --text:#f4f4f5; --muted:#a1a1aa; --dim:#71717a;
  --gold:#e8c66a; --gold-dim:#8a7438; --green:#7fd27a; --red:#ef6b5b;
  --radius:12px;
  --font:"STS GC Batang","AppleMyungjo","Batang","Nanum Myeongjo","Noto Serif KR",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block}

/* ---------- top bar: flat, no pill containers ---------- */
.bar{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:18px;padding:0 16px;
  background:rgba(9,9,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:17px;white-space:nowrap}
.brand img{width:24px;height:24px}
.nav{display:flex;align-items:center;gap:6px;height:52px;font-size:15px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;position:relative}
.nav img{width:24px;height:24px;object-fit:contain}
.nav:hover,.nav[aria-expanded="true"]{color:var(--gold)}
.nav[aria-expanded="true"]{border-bottom-color:var(--gold)}
.nav .dot{position:absolute;top:12px;left:18px}
.dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--bg)}
.dot.green{background:var(--green)} .dot.gold{background:var(--gold)}
.search{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;
  border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--dim);font-size:14px}
.search kbd{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.profile img{width:30px;height:30px;object-fit:contain}

/* ---------- menu panel ---------- */
.scrim{position:fixed;inset:52px 0 0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .15s}
.panel{position:fixed;top:52px;left:0;right:0;z-index:35;background:var(--surface);border-bottom:1px solid var(--line-2);
  box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .15s,transform .15s;
  max-height:calc(100vh - 52px);overflow:auto}
body.panel-open .scrim,body.panel-open .panel{opacity:1;pointer-events:auto}
body.panel-open .panel{transform:none}
.panel-in{max-width:1080px;margin:0 auto;padding:8px 16px 16px}
.prow{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow-h{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gold)}
.prow-h img{width:22px;height:22px;object-fit:contain}
.prow-h:hover{text-decoration:underline}
.items{display:flex;gap:4px;min-width:0;overflow:hidden}
.item{position:relative;flex:0 0 auto;width:92px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:10px;font-size:12.5px;text-align:center;color:var(--text)}
.item img{width:30px;height:30px;object-fit:contain}
.item:hover{background:var(--surface-2)}
.item .dot{position:absolute;top:6px;right:22px}
.more{color:var(--muted);justify-content:center}
.more b{font-size:18px;color:var(--gold);line-height:30px}
.panel-close{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- profile popover ---------- */
.pop{position:fixed;top:56px;right:16px;width:240px;z-index:35;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;
  padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.6);display:none}
body.pop-open .pop{display:block}
.pop a,.pop label{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;font-size:14px}
.pop a:hover{background:var(--surface-2)}
.pop select{margin-left:auto;background:var(--bg);color:var(--text);border:1px solid var(--line-2);border-radius:6px;font:inherit;font-size:13px;padding:3px 6px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ---------- mailbox ---------- */
.mailbox{position:fixed;right:16px;bottom:16px;z-index:20;width:52px;height:52px;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--line-2);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mailbox img{width:34px;height:34px}

/* ---------- pages ---------- */
main{max-width:1080px;margin:0 auto;padding:16px 16px 96px}
.page{display:none}
.page.on{display:block}
.news{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #3a2f55;border-radius:var(--radius);
  background:linear-gradient(90deg,rgba(80,52,140,.25),transparent);margin-bottom:16px;font-size:14px}
.news img{width:28px;height:28px}
.news small{color:var(--dim);margin-left:6px}
.news .go{margin-left:auto;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.meta{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.meta img{width:16px;height:16px;border-radius:50%}
.likes{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.likes svg{width:14px;height:14px}
.fallback{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2a2412,#0d0c08 70%)}
.fallback img{width:42%;max-width:72px;height:auto;opacity:.9}

/* reel */
.reel{position:relative;height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);background:#000}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.05fr;opacity:0;transition:opacity .8s ease}
.slide.on{opacity:1;z-index:1}
.slide .art{position:relative;overflow:hidden}
.slide .art img{width:100%;height:100%;object-fit:cover;transform:scale(1.05)}
/* The zoom lives only on the active slide, so it restarts every time a slide becomes active. */
.slide.on .art img{animation:kenburns 6.4s cubic-bezier(.2,.6,.2,1) both}
.slide .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 50%,#000)}
.slide .flash{position:absolute;inset:0;background:radial-gradient(circle at 40% 45%,rgba(255,236,170,.55),transparent 60%);opacity:0;pointer-events:none}
.slide.on .flash{animation:flash 1.1s ease-out both}
.slide .txt{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px 36px 28px 4px}
.slide q{font-size:clamp(21px,2.7vw,32px);line-height:1.35;quotes:"“" "”"}
.slide.on q{animation:rise .9s .25s cubic-bezier(.2,.7,.2,1) both}
.slide.on .meta{animation:rise .9s .45s cubic-bezier(.2,.7,.2,1) both}
.bars{position:absolute;left:16px;right:16px;top:12px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.bars i::after{content:"";display:block;height:100%;width:0;background:var(--gold)}
.bars i.done::after{width:100%}
.bars i.on::after{animation:fill 6.4s linear forwards}
.reel-nav{position:absolute;inset:0;display:flex;z-index:2}
.reel-nav button{flex:1}
@keyframes fill{to{width:100%}}
@keyframes kenburns{from{transform:scale(1.55) translate(-6%,5%) rotate(-1.5deg);filter:brightness(1.6) saturate(1.3)}
  22%{filter:brightness(1) saturate(1)}
  to{transform:scale(1.08) translate(2%,-2%) rotate(0)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

.toolbar{display:flex;align-items:center;gap:8px;margin:18px 0 12px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--text)}
.write{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid var(--gold-dim);color:var(--gold);background:#1a160c;font-size:13px}
.write img{width:18px;height:18px}
.rows{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2);background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.row:hover .thumb img{transform:scale(1.15)}
.thumb.contain img{object-fit:contain;padding:8px;background:radial-gradient(circle,#26262c,#0b0b0d)}
.row .s{font-size:17px;line-height:1.4;margin-bottom:6px}

/* index pages */
.ph{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
.ph img{width:40px;height:40px;object-fit:contain}
.ph h1{margin:0;font-size:26px;color:var(--gold)}
.crumb{font-size:13px;color:var(--dim);margin-bottom:4px}
.crumb a:hover{color:var(--gold)}
.gh{display:flex;align-items:center;gap:8px;font-size:17px;margin:28px 0 12px;color:var(--text)}
.gh img{width:26px;height:26px;object-fit:contain}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:132px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 35%,#1e1e24,var(--surface) 70%);font-size:15px;transition:border-color .15s,transform .15s}
.tile img{width:54px;height:54px;object-fit:contain;transition:transform .2s}
.tile:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.tile:hover img{transform:scale(1.12)}
.tile .dot{position:absolute;top:10px;right:10px}
.tile .kids{display:flex;gap:6px}
.tile .kids img{width:20px;height:20px}
.tile.wide{grid-column:span 2}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.game{position:relative;height:240px;border-radius:16px;overflow:hidden;border:1px solid var(--line-2);display:block;background:#000}
.game .art{position:absolute;inset:0;transition:transform .5s}
.game:hover .art{transform:scale(1.06)}
.game .art img{width:100%;height:100%;object-fit:cover}
.game .art.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.game::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.9))}
.game .name{position:absolute;left:18px;bottom:16px;z-index:1;display:flex;align-items:center;gap:10px;font-size:22px}
.game .name img{width:34px;height:34px}
.game .dot{position:absolute;top:14px;right:14px;z-index:1;width:10px;height:10px}
.side-link{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:var(--muted);font-size:14px}
.side-link img{width:24px;height:24px}
.side-link:hover{color:var(--gold)}
.hero{position:relative;height:150px;border-radius:16px;overflow:hidden;margin-bottom:8px;border:1px solid #3a2f55}
.hero>img{width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .ph{position:absolute;left:20px;bottom:6px;margin:0}

/* ---------- responsive ---------- */
@media (max-width:640px){
  .bar{padding:0 12px;gap:12px}
  .brand span,.search span,.search kbd,.nav .lbl{display:none}
  .search{flex:0 0 auto;width:34px;padding:0;justify-content:center;margin-left:auto}
  .panel{z-index:45;top:0;height:100dvh;max-height:none;border:0}
  .panel-close{display:flex;position:sticky;top:0;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;z-index:2}
  .panel-close b{font-size:16px;color:var(--gold)}
  .panel-close button{margin-left:auto;width:36px;height:36px;display:grid;place-items:center}
  .prow{grid-template-columns:1fr;gap:4px}
  .items{display:grid;grid-template-columns:repeat(4,1fr)}
  .item{width:auto}
  .reel{height:auto;aspect-ratio:4/5}
  .slide{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .slide .art::after{background:linear-gradient(180deg,transparent 50%,#000)}
  .slide .txt{padding:0 18px 22px}
  .row{grid-template-columns:56px 1fr;gap:12px}
  .thumb{width:56px;height:56px}
  .row .likes{grid-column:2}
  .row .s{font-size:15px}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{height:108px;font-size:13px}
  .tile img{width:40px;height:40px}
  .tile.wide{grid-column:span 3}
  .games{grid-template-columns:1fr}
  .game{height:190px}
  .pop{left:12px;right:12px;width:auto}
}
@media (prefers-reduced-motion:reduce){
  .slide{transition:none}
  .slide.on .art img,.slide.on .flash,.slide.on q,.slide.on .meta{animation:none}
  .bars i.on::after{animation:none;width:100%}
}
</style>
</head>

<script>
const ORIGIN = "https://scare-the-spire.flavono123.workers.dev";
const I = p => ORIGIN + p;
// Some assets 404 on production (STS1 nav icons, beta art); fall back to this repo's public/ copy.
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName === "IMG" && img.src.startsWith(ORIGIN)) img.src = "../../../../public" + img.src.slice(ORIGIN.length).split("?")[0];
}, true);

/* ---------- menu data ----------
   mark: "new" = new feature (green), "post" = new post (gold).
   fold: always sorted last (low-activity services). */
const SECTIONS = [

// Demo visit counts; clicking a menu item adds a visit (stored per browser).
const SEED_VISITS = { "sts2:카드 목록": 30, "sts2:유물 모음집": 18, "sts2:몬스터 도감": 9, "sts2:이벤트": 7, "sts1:카드 모음집": 6, "zz:커넥션스": 12, "toy:변형": 4 };
const load = () => { try { return JSON.parse(localStorage.getItem("mock:visits")) ?? SEED_VISITS; } catch { return SEED_VISITS; } };
let visits = load();
const save = () => { try { localStorage.setItem("mock:visits", JSON.stringify(visits)); } catch {} };

const rank = (sec) => sec.items.map(([label, icon, mark, fold], i) => ({ label, icon, mark, fold, i, v: visits[`${sec.id}:${label}`] ?? 0 }))
  .sort((a, b) => (!!a.fold - !!b.fold) || (!!b.mark - !!a.mark) || (b.v - a.v) || (a.i - b.i));
const dot = mark => mark ? `<i class="dot ${mark === "new" ? "green" : "gold"}"></i>` : "";

function renderPanel() {
  // As many items as one line holds, keeping one slot for "더보기".
  const rowWidth = document.querySelector(".panel-in").clientWidth - (matchMedia("(max-width:640px)").matches ? 0 : 202);
  const limit = matchMedia("(max-width:640px)").matches ? 3 : Math.max(2, Math.floor(rowWidth / 96) - 1);
  document.getElementById("panelRows").innerHTML = SECTIONS.map(sec => {
    const items = rank(sec), shown = items.slice(0, limit), rest = items.length - shown.length;
    return `<div class="prow">
      <a class="prow-h" href="${sec.href}" data-anchor="${sec.anchor ?? ""}"><img src="${I(sec.icon)}" alt="">${sec.title}</a>
      <div class="items">${shown.map(it => `<a class="item" href="#" data-key="${sec.id}:${it.label}">${dot(it.mark)}<img src="${I(it.icon)}" alt="">${it.label}</a>`).join("")}
      ${rest > 0 ? `<a class="item more" href="${sec.href}" data-anchor="${sec.anchor ?? ""}"><b>+${rest}</b>더보기</a>` : ""}</div>
    </div>`;
  }).join("");
  const marks = SECTIONS.flatMap(s => s.items.map(x => x[2]));
  const md = document.getElementById("menuDot");
  md.className = "dot " + (marks.includes("new") ? "green" : marks.includes("post") ? "gold" : "");
  md.hidden = !marks.some(Boolean);
}
renderPanel();
addEventListener("resize", renderPanel);
document.getElementById("panelRows").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  if (a.dataset.key) {
    e.preventDefault();
    visits[a.dataset.key] = (visits[a.dataset.key] ?? 0) + 1; save(); renderPanel();
    toast(`방문 기록: ${a.dataset.key.split(":")[1]} (${visits[a.dataset.key]}회) · 메뉴 순서에 반영`);
    return;
  }
  e.preventDefault(); closePanel(); location.hash = a.getAttribute("href");
  if (a.dataset.anchor) setTimeout(() => document.getElementById(a.dataset.anchor)?.scrollIntoView(), 50);
});
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1800); }

/* ---------- index page tiles (everything, no truncation) ---------- */

  ...toy.slice(1).map(x => tile(SECTIONS[3], x)),

let cur = 0, timer = null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function show(n) {
  cur = (n + reelItems.length) % reelItems.length;
  document.querySelectorAll(".slide").forEach((el, i) => el.classList.toggle("on", i === cur));
  document.querySelectorAll(".bars i").forEach((el, i) => { el.className = ""; void el.offsetWidth; el.className = i < cur ? "done" : i === cur ? "on" : ""; });
  clearTimeout(timer);
  if (!reduce) timer = setTimeout(() => show(cur + 1), 6400);
}
document.querySelectorAll(".reel-nav button").forEach(b => b.addEventListener("click", e => { e.preventDefault(); show(cur + Number(b.dataset.step)); }));

/* ---------- tiny hash router: home, /compendium, /vexing-puzzlebox, /toybox ---------- */
function route() {
  const path = location.hash.slice(1).split("?")[0] || "/";
  const known = [...document.querySelectorAll(".page")].some(p => p.dataset.page === path);
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.dataset.page === (known ? path : "/")));
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();

/* ---------- panel + profile popover ---------- */
const body = document.body, menuBtn = document.getElementById("menuBtn"), profileBtn = document.getElementById("profileBtn");
function openPanel() { setPop(false); body.classList.add("panel-open"); menuBtn.setAttribute("aria-expanded", "true"); }
function closePanel() { body.classList.remove("panel-open"); menuBtn.setAttribute("aria-expanded", "false"); }
function setPop(open) { body.classList.toggle("pop-open", open); profileBtn.setAttribute("aria-expanded", open); }
menuBtn.addEventListener("click", () => body.classList.contains("panel-open") ? closePanel() : openPanel());
document.getElementById("closeBtn").addEventListener("click", closePanel);
document.getElementById("scrim").addEventListener("click", closePanel);
profileBtn.addEventListener("click", e => { e.stopPropagation(); closePanel(); setPop(!body.classList.contains("pop-open")); });
document.addEventListener("click", e => { if (!e.target.closest("#pop")) setPop(false); });
addEventListener("keydown", e => { if (e.key === "Escape") { closePanel(); setPop(false); } });
