name: Cloudflare Workers Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job: the patch deploy and the main path queue apart (see the jobs).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  scope:
    name: Detect Cloudflare deployment scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      patch: ${{ steps.changes.outputs.patch }}
      main: ${{ steps.changes.outputs.main }}
      patch_after_main: ${{ steps.changes.outputs.patch_after_main }}
      deploy_any: ${{ steps.changes.outputs.deploy_any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Cloudflare deployment scope
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          patch_changed=false
          main_changed=false
          patch_after_main=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            patch_changed=true
            main_changed=true
            patch_after_main=true
            changed_files="workflow_dispatch"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi

            # Force-pushes leave github.event.before pointing at a commit that
            # is no longer fetched. Deploy both Workers instead of failing.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              patch_changed=true
              main_changed=true
              patch_after_main=true
              changed_files="missing-base ${base}"
            else
              changed_files="$(git diff --name-only "$base" "$GITHUB_SHA")"

              while IFS= read -r file; do
                [[ -z "$file" ]] && continue

                case "$file" in
                  AGENTS.md|docs/*|.codex/skills/*)
                    ;;
                  .github/workflows/cloudflare-workers.yml)
                    main_changed=true
                    patch_changed=true
                    ;;
                  workers/security-headers.ts|public/_headers)
                    # Both Workers send this policy.
                    main_changed=true
                    patch_changed=true
                    ;;
                  data/sts2-patch-notes/*|data/sts2-patches.json|data/sts2-patch-local-resources.json|src/components/patch-note-renderer.tsx|src/components/patches/*|src/app/\(main\)/patches/*|src/app/\[gameLocale\]/patches/*|src/lib/sts2-patch-*.ts|scripts/build-patch-worker.tsx|scripts/dev-patch-proxy.mjs|workers/patch-worker.ts|wrangler.patch.jsonc)
                    patch_changed=true
                    ;;
                  data/sts2-neowsletters.json|data/sts2-neowsletters/*|public/images/neowsletters/*)
                    main_changed=true
                    patch_changed=true
                    ;;
                  data/sts2/*|data/sts2-changes.json|data/sts2-entity-versions.json|public/images/sts2/*|src/app/\(codex\)/*|src/app/\[gameLocale\]/compendium/*|src/components/codex/*|src/lib/codex-*.ts|src/lib/compendium-*.ts|scripts/generate-static-api-data.ts)
                    main_changed=true
                    patch_after_main=true
                    ;;
                  package.json|pnpm-lock.yaml|next.config.*|postcss.config.*|tsconfig.json|src/app/globals.css|src/components/*|src/lib/*|scripts/*|workers/main-worker.ts|wrangler.jsonc)
                    main_changed=true
                    patch_changed=true
                    patch_after_main=true
                    ;;
                  workers/*)
                    # Every main Worker module (routing, OG, redirects);
                    # workers/patch-worker.ts matched the patch case above.
                    main_changed=true
                    ;;
                  wrangler.sts1.jsonc)
                    # The STS1 Worker deploys with every main build.
                    main_changed=true
                    ;;
                  data/*|public/*|src/*)
                    main_changed=true
                    ;;
                  *)
                    ;;
                esac
              done <<< "$changed_files"
            fi
          fi

          deploy_any=false
          if [[ "$patch_changed" == "true" || "$main_changed" == "true" || "$patch_after_main" == "true" ]]; then
            deploy_any=true
          fi

          {
            echo "patch=${patch_changed}"
            echo "main=${main_changed}"
            echo "patch_after_main=${patch_after_main}"
            echo "deploy_any=${deploy_any}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Cloudflare deploy scope"
            echo ""
            echo "- patch_changed: ${patch_changed}"
            echo "- main_changed: ${main_changed}"
            echo "- patch_after_main: ${patch_after_main}"
            echo ""
            echo "Changed files:"
            echo '```'
            echo "$changed_files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Patch-first critical path, in its own job and queue: a patch push starts its deploy
  # right after scope detection, never behind lint, the main build or another push's main
  # path (one main run is ~20 min). scripts/patch-worker-deploy.sh keeps an older run from
  # replacing a newer push's live patch pages.
  patch:
    name: Deploy patch Worker before main
    needs: scope
    if: needs.scope.outputs.patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    concurrency:
      group: cloudflare-patch
      cancel-in-progress: false
    outputs:
      manifest_sha256: ${{ steps.deploy.outputs.manifest_sha256 }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_ORIGIN }}
      # The data env (src/lib/data-env.ts); the name stays until step 7. The builds need no
      # Supabase URL or key since step 6: the steps that check or deploy the Worker's
      # API_SUPABASE_* vars get them in their own env.
      NEXT_PUBLIC_SUPABASE_ENV: ${{ vars.NEXT_PUBLIC_SUPABASE_ENV || 'production' }}
      # A production patch:build stops when it cannot read the reels from the site's /api
      # (src/lib/build-api-read.ts); 1 releases during an outage. The old variable name still works.
      ALLOW_BUILD_WITHOUT_API: ${{ vars.ALLOW_BUILD_WITHOUT_API || vars.ALLOW_BUILD_WITHOUT_SUPABASE }}
      NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN || vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Validate Cloudflare production configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$NEXT_PUBLIC_SITE_ORIGIN"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test "$NEXT_PUBLIC_SUPABASE_ENV" = "production"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Checked here, before the patch deploy; only the main job deploy step uses them.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm patch:test

      # patch:build bakes the shell patch reels from ${NEXT_PUBLIC_SITE_ORIGIN}/api, the main
      # Worker deployed before this run (STEP6_PLAN decision D1, option B). It needs no
      # Supabase URL, key or D1 token; ALLOW_BUILD_WITHOUT_API is the job's.
      - name: Deploy patch Worker before main
        id: deploy
        run: scripts/patch-worker-deploy.sh first
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PATCH_COMPENDIUM_MANIFEST_SOURCE: live

      - name: Smoke deployed patch Worker routes
        if: vars.CF_SMOKE != 'off'
        run: |
          origin="${NEXT_PUBLIC_SITE_ORIGIN%/}"
          latest="$(node -e 'const patches = require("./data/sts2-patches.json"); patches.sort((a, b) => b.date.localeCompare(a.date)); process.stdout.write(patches[0].version)')"
          source scripts/ci-smoke.sh

          smoke "/patches"
          smoke "/patches/${latest}"
          smoke "/en/patches/${latest}"
          smoke "/patches/latest"
          smoke "/_patches/patch.css"

  deploy:
    name: Deploy main to Cloudflare Workers
    # After the patch job, so the patch Worker still deploys before main. A patch job that a
    # newer push's patch job replaced in its queue (cancelled) does not hold main back: that
    # newer deploy carries this commit's patch pages too.
    needs: [scope, patch]
    if: ${{ !cancelled() && needs.scope.outputs.deploy_any == 'true' && needs.patch.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_ORIGIN }}
      # The data env (src/lib/data-env.ts); the name stays until step 7. The builds need no
      # Supabase URL or key since step 6: the steps that check or deploy the Worker's
      # API_SUPABASE_* vars get them in their own env.
      NEXT_PUBLIC_SUPABASE_ENV: ${{ vars.NEXT_PUBLIC_SUPABASE_ENV || 'production' }}
      # A production patch:build stops when it cannot read the reels from the site's /api
      # (src/lib/build-api-read.ts); 1 releases during an outage. The old variable name still works.
      ALLOW_BUILD_WITHOUT_API: ${{ vars.ALLOW_BUILD_WITHOUT_API || vars.ALLOW_BUILD_WITHOUT_SUPABASE }}
      NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN || vars.NEXT_PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        if: needs.scope.outputs.deploy_any == 'true'

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.deploy_any == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Validate Cloudflare production configuration
        if: needs.scope.outputs.deploy_any == 'true'
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$NEXT_PUBLIC_SITE_ORIGIN"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test "$NEXT_PUBLIC_SUPABASE_ENV" = "production"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Checked again here; used only by the main deploy step below.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - run: pnpm install --frozen-lockfile
        if: needs.scope.outputs.deploy_any == 'true'

      # Everything below is post-patch work: quality gates + main Worker path.
      - run: pnpm i18n:validate
        if: needs.scope.outputs.deploy_any == 'true'

      - run: pnpm lint
        if: needs.scope.outputs.deploy_any == 'true'

      # next-v2: caches saved before the globals.css @source not fix hold a CSS
      # module whose dependency snapshot is empty, so they reuse stale CSS forever.
      # Never restore them; the first v2 build starts cold.
      - name: Restore Next.js build cache
        if: needs.scope.outputs.main == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json', 'next.config.*', 'wrangler.jsonc', 'tsconfig.json', 'src/**/*', 'data/**/*', 'public/**/*', 'scripts/**/*', 'workers/**/*') }}
          restore-keys: |
            ${{ runner.os }}-next-v2-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-v2-

      - name: Compute Cloudflare build id
        if: needs.scope.outputs.main == 'true'
        run: |
          build_hash="$(
            git ls-files -z -- \
              package.json \
              pnpm-lock.yaml \
              next.config.ts \
              wrangler.jsonc \
              tsconfig.json \
              postcss.config.mjs \
              src \
              data \
              public \
              scripts \
              workers \
              | xargs -0 shasum -a 256 \
              | shasum -a 256 \
              | cut -c1-20
          )"

          echo "NEXT_BUILD_ID=cf-${build_hash}" >> "$GITHUB_ENV"
          echo "Cloudflare build id: cf-${build_hash}"

      - name: Free runner disk space for the static build
        if: needs.scope.outputs.main == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Build main Worker for Cloudflare
        if: needs.scope.outputs.main == 'true'
        run: pnpm cf:build

      - name: Check built CSS has every globals.css class
        if: needs.scope.outputs.main == 'true'
        run: pnpm css:check

      - name: Check main Worker size
        if: needs.scope.outputs.main == 'true'
        run: pnpm cf:size

      - name: Deploy STS1 Worker before main
        if: needs.scope.outputs.main == 'true'
        run: |
          # STS1 detail pages from this build (docs/designs/sts1-compendium-worker.md). Before
          # main: its STS1_WORKER binding fails the deploy while the target Worker does not exist.
          for attempt in 1 2 3; do
            echo "STS1 Worker deploy attempt ${attempt}/3"
            if pnpm cf:sts1:deploy; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "STS1 Worker deploy failed after ${attempt} attempts"
              exit 1
            fi

            sleep $((attempt * 15))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        if: needs.scope.outputs.main == 'true'
        run: |
          # Same-origin API vars (docs/supabase-exit/STEP1_DESIGN.md 2.1, 10). Passed on
          # every deploy and checked first, because --keep-vars would keep a bad value.
          export API_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}"
          export API_SUPABASE_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          export API_DATA_ENV=production
          npx tsx scripts/check-api-vars.ts --expect-env production
          for attempt in 1 2 3; do
            echo "main Worker deploy attempt ${attempt}/3"
            if pnpm cf:deploy:built \
              --var "API_SUPABASE_URL:${API_SUPABASE_URL}" \
              --var "API_SUPABASE_KEY:${API_SUPABASE_KEY}" \
              --var "API_DATA_ENV:${API_DATA_ENV}"; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "main Worker deploy failed after ${attempt} attempts"
              exit 1
            fi

            sleep $((attempt * 15))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only this step: the source of the Worker's API_SUPABASE_URL and API_SUPABASE_KEY
          # (Worker Supabase adapters, outbox mirror and sync, until step 7). No build runs here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Smoke deployed Cloudflare Worker
        if: needs.scope.outputs.main == 'true' && vars.CF_SMOKE != 'off'
        run: |
          origin="${NEXT_PUBLIC_SITE_ORIGIN%/}"
          source scripts/ci-smoke.sh
          source scripts/ci-smoke.sh

          smoke "/"
          smoke "/compendium/cards"
          smoke_static_detail "/compendium/powers/painful_stabs"
          smoke_static_detail "/en/compendium/powers/painful_stabs"
          smoke_static_detail "/compendium/sts1/cards/strike-r"
          smoke_static_detail "/en/compendium/sts1/relics/burning-blood"
          smoke "/generated/search-index.json"
          smoke "/generated/compendium-resource-manifest.json"

      - run: pnpm patch:test
        if: needs.scope.outputs.main == 'true' && needs.scope.outputs.patch_after_main == 'true' && needs.scope.outputs.patch != 'true'

      # The reels now come from the main Worker this run deployed, and the manifest lists its
      # new pages. Skipped when this run's patch deploy is live and the manifest is unchanged.
      - name: Redeploy patch Worker after main
        if: needs.scope.outputs.main == 'true' && needs.scope.outputs.patch_after_main == 'true'
        run: scripts/patch-worker-deploy.sh refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PATCH_COMPENDIUM_MANIFEST_SOURCE: live
          FIRST_MANIFEST_SHA256: ${{ needs.patch.outputs.manifest_sha256 }}

      - name: Smoke redeployed patch Worker routes
        if: needs.scope.outputs.main == 'true' && needs.scope.outputs.patch_after_main == 'true' && vars.CF_SMOKE != 'off'
        run: |
          origin="${NEXT_PUBLIC_SITE_ORIGIN%/}"
          latest="$(node -e 'const patches = require("./data/sts2-patches.json"); patches.sort((a, b) => b.date.localeCompare(a.date)); process.stdout.write(patches[0].version)')"
          source scripts/ci-smoke.sh

          smoke "/patches"
          smoke "/patches/${latest}"
          smoke "/en/patches/${latest}"
          smoke "/patches/latest"
          smoke "/_patches/patch.css"
