name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm i18n:validate

      - run: pnpm patch:test

      - run: npx tsx scripts/resolve-story-patch-line.spec.ts

      - run: pnpm codex:validate

      - run: pnpm test:version-api

      - run: pnpm test:security-headers

      - run: npx tsx scripts/link-preview.spec.ts

      - run: npx tsx scripts/worker-routing.spec.ts

      - run: pnpm test:api

      - run: npx tsx scripts/build-supabase-read.spec.ts

      - run: npx tsx scripts/encounter-compositions.spec.ts

      - run: pnpm lint

      - name: Free runner disk space for the static build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # The build production ships, with its route, asset and prefetch gates.
      # Pull requests get no other run of them: the deploy workflow is push-only.
      - run: pnpm cf:build

      - run: pnpm css:check

      - run: pnpm cf:size

